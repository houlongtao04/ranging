<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}線上請假系統{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/main.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
{% if me %}
<aside class="side">
  <div class="logo">📝 請假系統</div>
  <div class="profile">
    <div class="avatar">{{ me.display_name[0] }}</div>
    <div>
      <strong>{{ me.display_name }}</strong>
      <small>{{ me.class_name }}・{{ me.role.label }}</small>
    </div>
  </div>
  <nav>
    {% if me.role.value == 'student' %}
    <a href="/me/leaves" class="{{ 'on' if nav == 'list' }}">我的假單</a>
    <a href="/me/leaves/new" class="{{ 'on' if nav == 'new' }}">＋ 我要請假</a>
    {% else %}
    <a href="/inbox" class="{{ 'on' if nav == 'inbox' }}">審核假單</a>
    {% endif %}
  </nav>
  <form method="post" action="/logout">
    <button class="ghost logout">登出</button>
  </form>
</aside>
{% endif %}

<div class="page">
  {% if notice %}
  <div class="notice {{ notice.kind }}" role="status">
    <span>{{ notice.text }}</span>
    <button type="button" class="notice-x" aria-label="關閉">✕</button>
  </div>
  {% endif %}
  {% block main %}{% endblock %}
</div>
</body>
</html>
